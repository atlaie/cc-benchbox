# phase3-matrix-tok-in-sweep.yaml
#
# Task C: long-input-context (tok_in) sweep.
#
# 5 tok_in targets × 2 CC states = 10 cells. v3 grouping shares deploys
# across the 5 tok_in cells per CC state (all have image=vllm,
# cc_state=off|on, debug=true) → 2 deploys total, one per CC state.
# Each deploy amortises the ~25-min GLM-5.1-FP8 load across 5 iterations.
#
# Pre-requirements:
#   1. Pairs files built by build_ruler_pairs.py:
#        pairs_ruler/pairs_t100.json
#        pairs_ruler/pairs_t500.json
#        pairs_ruler/pairs_t1000.json
#        pairs_ruler/pairs_t4000.json
#        pairs_ruler/pairs_t8000.json
#   2. phase3_run_matrix.py patched with per-cell pairs_json override
#      (~9 LOC; see phase3_run_matrix_pairs_json.patch).
#
# Run:
#   # dry-run first to confirm v3 grouping into 2 deploys
#   python phase3_run_matrix.py --matrix phase3-matrix-tok-in-sweep.yaml --dry-run
#
#   # then for real (sequential; on-fail=abort means a failed group stops the run)
#   python phase3_run_matrix.py --matrix phase3-matrix-tok-in-sweep.yaml
#
# Cluster wall budget: ~3-4 h total
#   - 2 deploys × ~25 min load each
#   - 10 cells × 100 requests × ~15s avg-wall (mostly the 4000/8000 cells)
#
# Output layout:
#   runs/phase3/sweep_tok_in/
#     CI-off-i100/{requests.parquet, summary.json}
#     CI-off-i500/...
#     ...
#     CI-on-i8000/...
#     matrix_report.json
#
# Cell-ID naming: CI-(off|on)-i<target>. The `i<N>` suffix distinguishes
# from the existing C1-(off|on)-t<N> max_tokens-sweep namespace.

org_subdomain: pour-demain
tinfoil_host: control.inf8.tinfoil.sh

benchbox:
  scripts_dir: .
  pairs_json: pairs.json            # unused — every cell overrides this
  pairs_jsonl: pairs.jsonl          # unused (no vllm_bench_reference cells here)
  out_dir: runs/phase3/sweep_tok_in

defaults:
  n_requests: 100
  max_new_tokens: 32                # fixed across the sweep — isolates tok_in axis
  timeout: 900.0
  health_timeout: 3600
  health_poll_interval: 10.0
  metrics_interval: 0
  model: glm-5-1-fp8
  capture_target_logs: true
  gpu_memory_interval: 5.0
  ssh_user: tinfoil

images:
  vllm:
    repo: atlaie/cc-deep-eval
    tag: v0.0.25
    digest: sha256:f0f9ed90dba0a4860b4d4ec5d758d20b97d900b7d48d90d470ebd4757ba06f8e
    has_v1: true
    model: glm-5-1-fp8

# All cells: baseline condition, vllm image, max_new_tokens=32 (from
# defaults), sequential driver. The only request-level variation is
# pairs_json (different tok_in target). v3 groups by
# (image, cc_state, debug) → 2 groups, 5 cells each.
cells:
  # ===== CC-off arm (deploys once as vllm-off-debug-target) =====
  - cell_id: CI-off-i100
    condition: baseline
    cc_state: "off"
    image: vllm
    req_rate: 1.0
    pairs_json: pairs_ruler/pairs_t100.json

  - cell_id: CI-off-i500
    condition: baseline
    cc_state: "off"
    image: vllm
    req_rate: 1.0
    pairs_json: pairs_ruler/pairs_t500.json

  - cell_id: CI-off-i1000
    condition: baseline
    cc_state: "off"
    image: vllm
    req_rate: 1.0
    pairs_json: pairs_ruler/pairs_t1000.json

  - cell_id: CI-off-i4000
    condition: baseline
    cc_state: "off"
    image: vllm
    req_rate: 1.0
    pairs_json: pairs_ruler/pairs_t4000.json

  - cell_id: CI-off-i8000
    condition: baseline
    cc_state: "off"
    image: vllm
    req_rate: 1.0
    pairs_json: pairs_ruler/pairs_t8000.json

  # ===== CC-on arm (deploys once as vllm-on-debug-target) =====
  - cell_id: CI-on-i100
    condition: baseline
    cc_state: "on"
    image: vllm
    req_rate: 1.0
    pairs_json: pairs_ruler/pairs_t100.json

  - cell_id: CI-on-i500
    condition: baseline
    cc_state: "on"
    image: vllm
    req_rate: 1.0
    pairs_json: pairs_ruler/pairs_t500.json

  - cell_id: CI-on-i1000
    condition: baseline
    cc_state: "on"
    image: vllm
    req_rate: 1.0
    pairs_json: pairs_ruler/pairs_t1000.json

  - cell_id: CI-on-i4000
    condition: baseline
    cc_state: "on"
    image: vllm
    req_rate: 1.0
    pairs_json: pairs_ruler/pairs_t4000.json

  - cell_id: CI-on-i8000
    condition: baseline
    cc_state: "on"
    image: vllm
    req_rate: 1.0
    pairs_json: pairs_ruler/pairs_t8000.json
