# =====================================================================
# phase3-matrix-thinking.yaml
# Tier 3G — Reasoning prompts with enable_thinking=true
# =====================================================================
#
# Tests whether the +30% CC delta holds at long realised outputs.
# GLM-5.1's reasoning mode (`chat_template_kwargs.enable_thinking=true`)
# emits a <think>...</think> chain-of-thought block before the final
# answer; on GSM8K, thinking traces typically run 200-1500+ tokens, far
# longer than the t2048 sweep peak (p50=958).
#
# Hypothesis: linear fit `wall = 0.47 + 275.2·t/1000` (from Tier 1A
# phase-decomposition, R²=0.9999) extrapolates cleanly through ~5000
# realised output tokens. CC delta stays in the +30-32% band.
#
# Group key: (vllm, off|on, true). 2 cells → 2 deploys via v3 grouping.
# ---------------------------------------------------------------------

schema_version: 3   # informational only; phase3_run_matrix doesn't enforce

org_subdomain: pour-demain
tinfoil_host: control.inf8.tinfoil.sh

benchbox:
  # All three required by load_and_validate_matrix.
  scripts_dir: /Users/atlaie/prepilot/cc-benchbox/scripts
  # Build via:
  #   python prepare_gsm8k_pairs.py --n-pairs 25 --out pairs-gsm8k.json
  # Output is a JSON ARRAY (not JSONL) — driver's load_pairs requires
  # a single JSON list.
  pairs_json: pairs-gsm8k.json
  out_dir: runs/phase3

defaults:
  model: glm-5-1-fp8
  n_requests: 100
  # 4096-token ceiling chosen to give GSM8K reasoning traces room.
  # Per-cell `max_new_tokens` can override (and does — see cells below).
  max_new_tokens: 4096
  timeout: 600.0
  health_timeout: 1800.0
  health_poll_interval: 10.0
  debug: true

images:
  vllm:
    repo: atlaie/cc-deep-eval
    tag: v0.0.25
    digest: sha256:f0f9ed90dba0a4860b4d4ec5d758d20b97d900b7d48d90d470ebd4757ba06f8e
    has_v1: true
    model: glm-5-1-fp8

cells:
  - cell_id: C_R-off
    condition: baseline
    cc_state: off
    image: vllm
    driver: sequential
    debug: true
    # Wall budget: 100 prompts × (8s prefill + 4000 × 225 ms decode)
    # at 0.15 req/s → ~75 min CC-off, ~100 min CC-on.
    req_rate: 0.15
    max_new_tokens: 4096
    # NEW: per-cell field, forwarded to phase3_vllm_driver via
    # phase3_run_matrix → phase3_run_cell. See DRIVER_PATCHES.md.
    enable_thinking: true

  - cell_id: C_R-on
    condition: baseline
    cc_state: on
    image: vllm
    driver: sequential
    debug: true
    req_rate: 0.15
    max_new_tokens: 4096
    enable_thinking: true