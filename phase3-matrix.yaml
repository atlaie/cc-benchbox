# phase3-matrix.yaml
#
# Single source of truth for the Phase 3 measurement matrix.
# Read by phase3_run_matrix.py (laptop-side orchestrator) and
# phase3_aggregate.py (laptop-side aggregator).
#
# Cell ordering matters — see PHASE3_PLAN §4.3. Don't reorder lightly.
# Image digests must be filled before running. Empty digest = validation error.

# --- Tinfoil deployment context ---
org_subdomain: pour-demain          # Targets resolve as <name>.debug.<org>.containers.tinfoil.dev
tinfoil_host: control.inf8.tinfoil.sh

# --- Long-lived benchbox ---
benchbox:
  # All paths below are laptop-side. The benchbox container is unused now
  # (Tinfoil-CC blocks intra-container egress; drivers run on the laptop).
  scripts_dir: .
  pairs_json: pairs.json
  pairs_jsonl: pairs.jsonl
  out_dir: runs/phase3

# --- Per-cell default overrides ---
defaults:
  n_requests: 100
  max_new_tokens: 32
  timeout: 900.0                    # Per-request HTTP timeout (sec)
  health_timeout: 3600            # Max wait for target /health → ready (sec). Grad sidecar load ~16 min.
  health_poll_interval: 10.0
  metrics_interval: 0             # /metrics poll cadence (sec); set to 0 to disable
  model: glm-5-1-fp8                # vLLM served-model name
  capture_target_logs: true         # `tinfoil container logs <target>` before delete
  gpu_memory_interval: 5.0  # seconds between nvidia-smi snapshots; 0 = disabled
  ssh_user: tinfoil          # tinfoil container ssh default user

# --- Target images ---
# digest is what gets pinned in the report's reproducibility section. Use:
#   tinfoil container inspect <existing-deploy> | jq -r .image.digest
# or read from atlaie/cc-deep-eval/tinfoil-config.yml after a fresh build.
images:
  vllm:
    repo: atlaie/cc-deep-eval
    tag: v0.0.25
    digest: sha256:f0f9ed90dba0a4860b4d4ec5d758d20b97d900b7d48d90d470ebd4757ba06f8e
    has_v1: true
    model: glm-5-1-fp8
  gradient:
    repo: atlaie/cc-deep-eval
    tag: v0.1.16-grad
    digest: sha256:41b1d219b967e73683f78601f0b039e88ba91e77567a25885aab4a1162e00710
    has_v1: false
    model: glm-5-1-fp8
  # NEW — Llama-3.1-70B-Instruct-FP8 for the H3 disambiguation experiment.
  # Matches the published Phala/Llama benchmark exactly: dense model on same TEE.
  vllm_llama70b:
    repo: atlaie/cc-deep-eval        # or wherever you build the variant
    tag: v0.0.27-llama70b-1            # placeholder — update after image wrap
    digest: sha256:f0f9ed90dba0a4860b4d4ec5d758d20b97d900b7d48d90d470ebd4757ba06f8e        # populate after wrap
    has_v1: true
    model: llama-3-1-70b-fp8         # MUST match --served-model-name in the image
  vllm_llama70b_tp1:
    repo: atlaie/cc-deep-eval
    tag: v0.0.28-llama70b-tp1
    digest: sha256:f0f9ed90dba0a4860b4d4ec5d758d20b97d900b7d48d90d470ebd4757ba06f8e
    has_v1: true
    model: llama-3-1-70b-fp8
# --- Cells (run in declared order) ---
# vllm_bench_reference: true → orchestrator runs `vllm bench serve` after phase3_run_cell.py
#                              for that cell. Plan: C1-off + C1-on only (baseline pair).
cells:
  # NOTE: cc_state values MUST be quoted strings ("on" / "off"). In YAML 1.1
  # (PyYAML's default) the bare tokens `on` and `off` parse to True/False.
  # Same applies to yes/no/y/n. Keep the quotes.
  #
  # Phase 1 — establishes the CC toggle works on the simplest cell + validates phase3_vllm_driver.py.
  - cell_id: C1-off
    condition: baseline
    cc_state: "off"
    image: vllm
    req_rate: 1.0
    vllm_bench_reference: true

  - cell_id: C1-on
    condition: baseline
    cc_state: "on"
    image: vllm
    req_rate: 1.0
    vllm_bench_reference: true

  # Phase 2 — routing (lowest payload overhead among instrumented cells).
  - cell_id: C4-off
    condition: routing
    cc_state: "off"
    image: vllm
    req_rate: 0.2

  - cell_id: C4-on
    condition: routing
    cc_state: "on"
    image: vllm
    req_rate: 0.2

  # Phase 3 — repe_bundle (largest payload overhead).
  - cell_id: C2-off
    condition: repe_bundle
    cc_state: "off"
    image: vllm
    req_rate: 0.2

  - cell_id: C2-on
    condition: repe_bundle
    cc_state: "on"
    image: vllm
    req_rate: 0.2

  # Phase 4 — gradient (compute-bound, validated driver, distinct latency shape).
  - cell_id: C3-off
    condition: gradient
    cc_state: "off"
    image: gradient
    req_rate: 0.05

  - cell_id: C3-on
    condition: gradient
    cc_state: "on"
    image: gradient
    req_rate: 0.05

  - cell_id: C1-off-stream
    condition: baseline
    cc_state: "off"
    image: vllm
    req_rate: 1.0
    driver: stream         # NEW: sequential | stream | concurrent
    n_requests: 50         # override default 100

  - cell_id: C1-on-stream
    condition: baseline
    cc_state: "on"
    image: vllm
    req_rate: 1.0
    driver: stream
    n_requests: 50

  - cell_id: C1-off-c8
    condition: baseline
    cc_state: "off"
    image: vllm
    req_rate: 8.0          # raised to feed 8 concurrent slots
    driver: concurrent
    concurrency: 8
    n_requests: 200
    stream: true           # capture TTFT under load

  - cell_id: C1-on-c8
    condition: baseline
    cc_state: "on"
    image: vllm
    req_rate: 8.0
    driver: concurrent
    concurrency: 8
    n_requests: 200
    stream: true
    
  - cell_id: C5-off
    image: vllm
    condition: steer
    cc_state: "off"
    req_rate: 0.15
    steer_direction: data/steering/direction_L62.npy

  - cell_id: C5-on
    image: vllm
    condition: steer
    cc_state: "on"
    req_rate: 0.15
    steer_direction: data/steering/direction_L62.npy
    # Llama-3.1-70B-FP8 baseline pair — H3 disambiguation test.
    # Same hardware (Tinfoil/TDX/H200), same workload, dense vs sparse model.
  - cell_id: C0-off
    condition: baseline
    cc_state: "off"
    image: vllm_llama70b
    req_rate: 1.0

  - cell_id: C0-on
    condition: baseline
    cc_state: "on"
    image: vllm_llama70b
    req_rate: 1.0

  - cell_id: C0-off-tp1
    condition: baseline
    cc_state: "off"
    image: vllm_llama70b_tp1
    req_rate: 1.0

  - cell_id: C0-on-tp1
    condition: baseline
    cc_state: "on"
    image: vllm_llama70b_tp1
    req_rate: 1.0
  # Tier 1B: attestation-enabled baseline (production mode, debug=false).
  # Tests whether the +30% CC delta holds with attestation + TLS handshake
  # on, the production configuration. SSH unavailable in this mode — if
  # anything stalls, no in-container shell to debug.
  - cell_id: C1-off-attest
    condition: baseline
    cc_state: off
    image: vllm
    req_rate: 0.15
    driver: sequential
    debug: false

  - cell_id: C1-on-attest
    condition: baseline
    cc_state: on
    image: vllm
    req_rate: 0.15
    driver: sequential
    debug: false