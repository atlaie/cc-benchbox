cvm-version: 0.8.1
cpus: 128
memory: 1048576
gpus: 1

containers:
  - name: "benchbox"
    # Updated automatically by .github/workflows/tinfoil-build.yml on each release.
    image: "ghcr.io/tinfoilsh/model-benchbox@sha256:5b2b8f3678c7a5e163cb8f0ac20faf2ff9b5c3d51c6fc723a1dcb2398848b6ac" # v0.0.4
    runtime: nvidia
    gpus: all
    ipc: host
    restart: always
    secrets:
      - GITHUB_TOKEN
      - HF_TOKEN
      - TINFOIL_API_KEY

# The benchbox is accessed via debug-mode SSH, not over HTTPS. The shim block
# is required by schema but never exercised — nothing is listening on port
# 8000 inside the container.
shim:
  upstream-port: 8000
  paths:
    - /health
