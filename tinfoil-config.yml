cvm-version: 0.8.1
cpus: 128
memory: 1048576
gpus: 8

containers:
  - name: "benchbox"
    # Updated automatically by .github/workflows/tinfoil-build.yml on each release.
    image: "ghcr.io/tinfoilsh/model-benchbox@sha256:3f480bbd613fb02843cab642740a8f557e7c6b687ad46dc3f9a407ac82a273f1" # v0.0.3
    runtime: nvidia
    gpus: all
    ipc: host
    restart: always
    secrets:
      - GITHUB_TOKEN
      - HF_TOKEN
      - TINFOIL_API_KEY

# The benchbox is accessed via debug-mode SSH, not over HTTPS. The shim block
# is required by schema but never exercised — nothing is listening on port
# 8000 inside the container.
shim:
  upstream-port: 8000
  paths:
    - /health
