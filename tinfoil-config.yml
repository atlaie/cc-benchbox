cvm-version: 0.8.0
cpus: 128
memory: 1048576
gpus: 8

containers:
  - name: "benchbox"
    # Updated automatically by .github/workflows/tinfoil-build.yml on each release.
    image: "ghcr.io/tinfoilsh/model-benchbox@sha256:29dc722fb72631bf07e6e338c92a16ef63698801820f9958afffe6a2b046a695" # v0.0.1
    runtime: nvidia
    gpus: all
    ipc: host
    restart: always
    secrets:
      - GITHUB_TOKEN
      - HF_TOKEN
      - TINFOIL_API_KEY

# The benchbox is accessed via debug-mode SSH, not over HTTPS. The shim block
# is required by schema but never exercised — nothing is listening on port
# 8000 inside the container.
shim:
  upstream-port: 8000
  paths:
    - /health
