# =====================================================================
# phase3-matrix-thinking-v3.yaml
# Tier 3G v3 — Robustness rerun with streaming dispatch
# =====================================================================
#
# Differences vs phase3-matrix-thinking-v2.yaml:
#   - driver: sequential → driver: stream   (BOTH cells)
#     Required because non-streaming HTTPS requests taking >60s die with
#     "Failure when receiving data from the peer" (edge / NAT idle-TCP
#     timeout, observed empirically 2026-05-26). GSM8K thinking-mode
#     responses run 200-1500+ tokens at ~200ms/token = far over 60s.
#
# Everything else byte-identical to v2: image digest, model, prompts,
# n_requests, req_rate, max_new_tokens, enable_thinking, timeout,
# health_timeout. Streaming adds a small constant per-request overhead
# (~50ms SSE setup) that perturbs the intercept of the fit but leaves
# the per-token slope unchanged.
#
# Brief reference: §4.2, Figure 3.  Plan reference: ROBUSTNESS_PLAN.md §4.1.
# ---------------------------------------------------------------------

schema_version: 3

org_subdomain: pour-demain
tinfoil_host: control.inf8.tinfoil.sh

benchbox:
  scripts_dir: .
  pairs_json: pairs-gsm8k.json
  out_dir: runs/phase3_v2

defaults:
  model: glm-5-1-fp8
  n_requests: 100
  max_new_tokens: 4096
  timeout: 1000.0
  health_timeout: 1800.0
  health_poll_interval: 10.0
  debug: true

images:
  vllm:
    repo: atlaie/cc-deep-eval
    tag: v0.0.25
    digest: sha256:f0f9ed90dba0a4860b4d4ec5d758d20b97d900b7d48d90d470ebd4757ba06f8e
    has_v1: true
    model: glm-5-1-fp8

cells:
  - cell_id: C_R-off
    condition: baseline
    cc_state: off
    image: vllm
    driver: stream
    debug: true
    req_rate: 0.15
    max_new_tokens: 4096
    enable_thinking: true

  - cell_id: C_R-on
    condition: baseline
    cc_state: on
    image: vllm
    driver: stream
    debug: true
    req_rate: 0.15
    max_new_tokens: 4096
    enable_thinking: true
