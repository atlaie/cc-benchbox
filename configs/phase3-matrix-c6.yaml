# =====================================================================
# phase3-matrix-harmbench.yaml
# Tier 1C — HarmBench safety eval (refusal-rate comparison under CC)
# =====================================================================
#
# Tests two distinct claims:
#
# 1. CC encryption does not change model behavior on a real safety
#    benchmark. C_H-off and C_H-on should produce ≈identical refusal
#    decisions on the same prompts. analyze_harmbench.py reports the
#    agreement rate (Q1).
#
# 2. The EII-4 active intervention (RepE concept-direction steering,
#    Phase 2 D6) can be executed inside CC. C_H-on-steer applies the
#    L62 anti-refusal direction (scale=10, sign=-1, the known-good D6
#    setting; scale=20 collapses). Expected: refusal rate drops
#    substantially vs C_H-on baseline (Q2).
#
# Group key: (vllm, off|on, true). 3 cells → 2 deploys via v3 grouping
# (C_H-on and C_H-on-steer share the CC-on deploy).
#
# Steering mechanism note
# -----------------------
# We DO NOT use `condition: steer` (the existing path that reads a
# .npy via phase3_steering.build_steer_xargs). Instead, C_H-on-steer
# uses `condition: baseline` and provides `apply_steering_json`, the
# new file-based path. The driver's send_one() injects
# `apply_steering_vectors` into vllm_xargs at request time. Both
# paths converge at the same vllm-lens key; we picked the new one
# because the JSON payload encodes Phase 2 D6's parameters
# (scale=10, sign=-1, norm_match=True, layer=62) explicitly and is
# diffable / checksummable.
# ---------------------------------------------------------------------

schema_version: 3

org_subdomain: pour-demain
tinfoil_host: control.inf8.tinfoil.sh

benchbox:
  scripts_dir: /Users/atlaie/prepilot/cc-benchbox/scripts
  # Build via:
  #   python prepare_harmbench_pairs.py --n-pairs 25 --split test \
  #     --out pairs-harmbench.json
  # Output is a JSON ARRAY (not JSONL) — driver's load_pairs requires
  # a single JSON list.
  pairs_json: pairs-harmbench-50pairs.json
  out_dir: runs/phase3

defaults:
  model: glm-5-1-fp8
  n_requests: 100
  # HarmBench prompts are short (~30 tok in); refusals are 50-200 tok,
  # compliance with the behavior could run longer. 512 is comfortable.
  max_new_tokens: 32
  timeout: 120.0
  health_timeout: 3600.0
  health_poll_interval: 10.0
  debug: true

images:
  vllm:
    repo: atlaie/cc-deep-eval
    tag: v0.0.25
    digest: sha256:f0f9ed90dba0a4860b4d4ec5d758d20b97d900b7d48d90d470ebd4757ba06f8e
    has_v1: true
    model: glm-5-1-fp8

cells:
  # ----- Reference: CC off, no steering ------------------------------
  - cell_id: C6-off
    condition: baseline
    cc_state: off
    image: vllm
    driver: sequential
    debug: true
    req_rate: 0.15

  # ----- CC effect: CC on, no steering -------------------------------
  - cell_id: C6-on
    condition: baseline
    cc_state: on
    image: vllm
    driver: sequential
    debug: true
    req_rate: 0.15